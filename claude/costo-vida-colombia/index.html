:root{
  /* --- marca Javier Forero · claro --- */
  --purple:#4e00ff; --purple-light:#7c4dff; --deep-blue:#041c59; --vibrant-blue:#0048ff;
  --bg:#f5f7fb; --white:#ffffff; --border:#e3e8f5; --soft-lilac:#f6f3ff;
  --text:#1f2937; --muted:#5f6b7a;
  --shadow:0 12px 32px rgba(4,28,89,.08);
  /* --- capa de datos: rampa divergente anclada en el azul de marca --- */
  --c1:#274ea7; --c2:#497ff4; --c3:#98b7f5; --c4:#ecebe7; --c5:#eba296; --c6:#d95446; --c7:#97261d;
  --land:#dfe4ef; --land-line:rgba(4,28,89,.22); --terr-line:rgba(4,28,89,.45);
  --dept-tint:.34;
  --font:'IgraSans',Aptos,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --purple:#7c4dff; --purple-light:#9a78ff; --deep-blue:#dfe6ff; --vibrant-blue:#7a98ff;
  --bg:#070c1c; --white:#101732; --border:#243057; --soft-lilac:#181c3e;
  --text:#eaeef9; --muted:#9aa4bf;
  --shadow:0 12px 32px rgba(0,0,0,.35);
  --c1:#9cbeff; --c2:#4d85fe; --c3:#375595; --c4:#252930; --c5:#8b3c32; --c6:#e95142; --c7:#f7a599;
  --land:#182142; --land-line:rgba(223,230,255,.20); --terr-line:rgba(223,230,255,.45);
  --dept-tint:.40;
}
*{box-sizing:border-box}
img,svg,video{max-width:100%;height:auto}
html{transition:background-color .25s ease,color .25s ease}
body{background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  transition:background-color .25s ease,color .25s ease}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding:clamp(14px,3vw,28px) clamp(16px,4vw,32px) 56px}

/* ---------- controles de marca ---------- */
.brand-controls{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;
  display:flex;gap:8px;z-index:60}
.brand-pill{font-family:var(--font);font-weight:700;font-size:13px;min-height:44px;
  background:var(--white);color:var(--deep-blue);border:1px solid var(--border);
  border-radius:999px;padding:8px 15px;cursor:pointer;box-shadow:var(--shadow);
  display:inline-flex;align-items:center;gap:6px;line-height:1;
  transition:background-color .25s ease,color .25s ease,border-color .25s ease}
.brand-pill:hover{border-color:var(--purple)}
@media (max-width:520px){.brand-controls{top:calc(8px + env(safe-area-inset-top,0px));right:10px;gap:6px}
  .brand-pill{padding:7px 12px;font-size:12px}}

/* ---------- hero ---------- */
.hero{background:linear-gradient(135deg,#041c59 0%,#4e00ff 68%,#7c4dff 100%);color:#fff;
  border-radius:clamp(20px,4vw,28px);padding:clamp(24px,5vw,40px);padding-right:clamp(24px,5vw,150px)}
.hero .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.82)}
.hero h1{font-size:clamp(26px,5.4vw,44px);line-height:1.08;margin-top:10px;color:#fff}
.hero .sub{font-size:clamp(15px,2.2vw,19px);margin-top:12px;max-width:60ch;color:rgba(255,255,255,.92);
  line-height:1.4}
.hero .sub b{color:#fff;font-weight:700}

/* ---------- escala ---------- */
.scale{margin-top:clamp(18px,3vw,26px);background:var(--white);border:1px solid var(--border);
  border-radius:18px;padding:clamp(14px,2.5vw,18px);box-shadow:var(--shadow)}
.scale-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.scale-title{font-size:12.5px;font-weight:700;color:var(--deep-blue);letter-spacing:.02em}
.scale-note{font-size:12px;color:var(--muted)}
.bins{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:10px}
.bin{height:24px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(4,28,89,.08)}
.bin:first-child{border-radius:12px 3px 3px 12px}
.bin:last-child{border-radius:3px 12px 12px 3px}
.bin-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:6px;
  font-size:clamp(9px,1.5vw,11px);white-space:nowrap;color:var(--muted);
  font-variant-numeric:tabular-nums;text-align:center}
.bin-ends{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-size:11.5px;
  color:var(--muted);font-weight:700}
.levels{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:13px;padding-top:12px;
  border-top:1px solid var(--border);font-size:11.5px;color:var(--muted)}
.lv{display:inline-flex;align-items:center;gap:7px}
.lv i{width:15px;height:15px;border-radius:4px;display:inline-block;flex:0 0 auto}
.lv-full{background:var(--c6);border:1px solid var(--terr-line)}
.lv-tint{background:color-mix(in srgb,var(--c6) 34%,var(--land));border:1px solid var(--land-line)}
.lv-none{background:var(--land);border:1px solid var(--land-line)}

/* ---------- layout ---------- */
.stage{display:grid;grid-template-columns:1fr;gap:clamp(16px,3vw,24px);margin-top:clamp(18px,3vw,26px);
  align-items:start}
@media (min-width:1024px){.stage{grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr)}
  .stage>.panel:first-child{position:sticky;top:calc(14px + env(safe-area-inset-top,0px))}}
.side{display:grid;gap:clamp(16px,3vw,22px)}
.panel{background:var(--white);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);
  transition:background-color .25s ease,border-color .25s ease}
.panel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border)}
.panel-title{font-size:13px;font-weight:700;color:var(--deep-blue)}
.panel-sub{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- mapa ---------- */
.mapbox{position:relative;padding:8px}
svg.map{display:block;width:100%;height:auto;touch-action:manipulation}
.dep{fill:var(--land);stroke:var(--land-line);stroke-width:.8;vector-effect:non-scaling-stroke}
.deptint{stroke:var(--land-line);stroke-width:.8;vector-effect:non-scaling-stroke;
  fill-opacity:var(--dept-tint);cursor:pointer}
.terr{stroke:var(--terr-line);stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
.mk{stroke:var(--white);stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer}
.mk.on,.terr.on{stroke:var(--purple);stroke-width:2.6}
.deptint.on{stroke:var(--purple);stroke-width:1.6}
.dot{fill:var(--white);pointer-events:none}
.lbl{font-size:15px;font-weight:700;fill:var(--text);paint-order:stroke;
  stroke:var(--white);stroke-width:4.5px;stroke-linejoin:round;pointer-events:none}
.dim{opacity:.3}
.zoomrow{position:absolute;right:14px;top:14px;display:flex;gap:6px}
.zbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--white);
  color:var(--muted);font-size:16px;font-weight:700;cursor:pointer;line-height:1;display:grid;place-items:center}
.zbtn:hover{background:var(--soft-lilac);color:var(--purple);border-color:var(--purple)}

/* ---------- lista ---------- */
.rows{padding:6px 6px 10px}
.row{display:grid;grid-template-columns:minmax(96px,132px) 1fr 54px;gap:8px;align-items:center;
  padding:6px 10px;border-radius:11px;cursor:pointer;border:1px solid transparent;min-height:34px}
.row:hover{background:var(--soft-lilac)}
.row.on{background:var(--soft-lilac);border-color:var(--purple)}
.row-name{font-size:12.5px;font-weight:700;color:var(--deep-blue);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-name span{color:var(--muted);font-weight:400;font-size:10.5px}
.track{position:relative;height:16px}
.track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--border)}
.bar{position:absolute;top:2px;height:12px;border-radius:3px;min-width:3px}
.row-val{font-size:12.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- detalle ---------- */
.detail{padding:clamp(14px,2.5vw,18px)}
.d-top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.d-name{font-size:clamp(19px,2.6vw,23px);font-weight:700;color:var(--deep-blue);letter-spacing:-.015em}
.d-dep{font-size:12px;color:var(--muted);margin-top:2px}
.d-idx{font-size:clamp(30px,4.6vw,38px);font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.025em;text-align:right}
.d-cap{font-size:11px;color:var(--muted);text-align:right;margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px;margin-top:15px;
  border-top:1px solid var(--border);padding-top:13px}
.fact-k{font-size:10.5px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;font-weight:700}
.fact-v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;color:var(--deep-blue)}
.fact-v small{font-weight:400;font-size:11px;color:var(--muted)}
.insight{margin-top:13px;background:var(--soft-lilac);border-left:5px solid var(--purple);
  border-radius:0 12px 12px 0;padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.45}
.insight b{color:var(--deep-blue);font-weight:700}
.sparkwrap{margin-top:15px;border-top:1px solid var(--border);padding-top:13px}
.spark-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.spark-t{font-size:11.5px;font-weight:700;color:var(--deep-blue)}
.spark-v{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.spark-v b{color:var(--deep-blue)}
svg.spark{display:block;width:100%;height:62px;margin-top:8px;overflow:visible}
.empty{margin-top:9px;padding:11px 12px;border:1px dashed var(--border);border-radius:12px;
  font-size:11.5px;color:var(--muted);line-height:1.45}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:1fr;gap:clamp(12px,2vw,16px);margin-top:clamp(18px,3vw,26px)}
@media (min-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:16px;
  box-shadow:var(--shadow)}
.kpi-k{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:700}
.kpi-v{font-size:clamp(24px,3.2vw,29px);font-weight:700;margin-top:7px;color:var(--purple);
  font-variant-numeric:tabular-nums;letter-spacing:-.025em;line-height:1.05}
.kpi-d{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.42}

/* ---------- tabla ---------- */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:0 0 18px 18px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:600px}
th,td{padding:9px 13px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;
  position:sticky;top:0;background:var(--white)}
th:first-child,td:first-child{text-align:left}
td{font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px}

/* ---------- segmentado ---------- */
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-family:var(--font);
  font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--purple);color:#fff}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:6px}

/* ---------- notas ---------- */
.notes{margin-top:clamp(22px,4vw,34px);display:grid;grid-template-columns:1fr;gap:clamp(16px,3vw,22px)}
@media (min-width:640px){.notes{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.notes{grid-template-columns:repeat(4,1fr)}}
.note{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:16px;
  box-shadow:var(--shadow)}
.note.hot{background:var(--soft-lilac);border-left:5px solid var(--purple)}
.note h3{font-size:12.5px;font-weight:700;color:var(--deep-blue);margin-bottom:8px;
  letter-spacing:.04em;text-transform:uppercase}
.note p{margin:0 0 9px;font-size:12px;color:var(--muted);line-height:1.5}
.note p:last-child{margin-bottom:0}
.note b{color:var(--deep-blue);font-weight:700}
.src{margin-top:clamp(18px,3vw,26px);font-size:11px;color:var(--muted);line-height:1.65;
  background:var(--white);border:1px solid var(--border);border-radius:18px;padding:14px 16px}
.src a{color:var(--vibrant-blue);text-decoration:underline;text-underline-offset:2px}
.foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--border);text-align:center;font-size:12px}
.foot b{color:var(--muted);font-weight:700}
.foot i{color:var(--purple);font-style:normal;padding:0 5px}
.foot a{color:var(--vibrant-blue);text-decoration:none;font-weight:700}

/* ---------- tooltip ---------- */
.tip{position:fixed;z-index:70;pointer-events:none;opacity:0;transition:opacity .11s;
  background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
  padding:10px 12px;font-size:12px;max-width:236px}
.tip.show{opacity:1}
.tip-n{font-weight:700;font-size:13px;color:var(--deep-blue)}
.tip-r{display:flex;justify-content:space-between;gap:14px;color:var(--muted);margin-top:3px;
  font-variant-numeric:tabular-nums}
.tip-r b{color:var(--text);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  n2a:"The <b>full tone</b> covers the territory actually measured: the municipality, or the municipalities of the metro area when DANE's domain is a metro area. The dot marks the capital.",
  n2b:"The <b>soft tone</b> shades that city's department for geographic context. <b>It is not a departmental measurement</b>: Riohacha's index does not describe all of La Guajira.",
  n2c:"<b>Grey</b> marks the nine departments with no measured city — Cundinamarca and almost all of the Orinoquía and Amazonía. That gap is itself a finding.",
  n3t:"The sparkline does not compare cities",
  n3a:"The line shows 36 months of each city's CPI, scaled to its own min and max: it says <b>how fast prices rise there</b>, never how high they are. The index number is based on December 2018 = 100 <b>in each city separately</b>.",
  n3b:"The series was rebuilt by chaining the monthly changes DANE publishes, which is all it publishes by city. Validated against the official annual change for August 2026: maximum deviation <b>0.03 points</b>.",
  n4t:"What is missing",
  n4a:"<b>Quibdó</b> shows color but no line: DANE stopped publishing its CPI separately in 2019.",
  n4b:"The map covers <b>23 of the country's 1,122 municipalities</b>. The rest have no official price-level measurement; nothing was filled in.",
  n4c:"Housing enters only indirectly. It is the component where cities differ most, and the one no Colombian source publishes as a peso level.",
  srcHtml:"<b>Sources.</b> Price level: DANE, <a href='{nivel}' target='_blank' rel='noopener'>Monetary poverty 2025</a> — poverty lines by domain, current pesos per capita/month. Population: DANE, municipal projections by area based on the 2018 census, urban seat 2025. CPI: DANE, monthly change by city annex, August 2026. Coordinates and codes: <a href='{divipola}' target='_blank' rel='noopener'>DIVIPOLA</a>. Geometry: National Geostatistical Framework 2018, Geoportal DANE, simplified. Metro area composition: <a href='{am}' target='_blank' rel='noopener'>GEIH methodological note</a>. Cut-off date: 17 September 2026."
 }
};
var LANG="es";
function T(k){var d=I18N[LANG]||I18N.es;return d[k]!=null?d[k]:k}
function fill(s,o){return s.replace(/\{(\w+)\}/g,function(_,k){return o[k]!=null?o[k]:""})}

/* ============ formatos ============ */
var nf0,nf1,nf2,LOC;
function setLocale(){
  LOC=LANG==="es"?"es-CO":"en-US";
  nf0=new Intl.NumberFormat(LOC,{maximumFractionDigits:0});
  nf1=new Intl.NumberFormat(LOC,{minimumFractionDigits:1,maximumFractionDigits:1});
  nf2=new Intl.NumberFormat(LOC,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function pesos(n){return "$"+nf0.format(n)}
var MES={es:["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"],
         en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]};
function mesLabel(ym){var p=ym.split("-");return MES[LANG][+p[1]-1]+" "+p[0].slice(2)}
function amName(c){return c.am?(c.n+(LANG==="es"?" A.M.":" metro")):c.n}

/* ============ bins ============ */
var BINS=[{max:85,v:"--c1",t:"< 85"},{max:92,v:"--c2",t:"85–92"},{max:98,v:"--c3",t:"92–98"},
          {max:102,v:"--c4",t:"98–102"},{max:108,v:"--c5",t:"102–108"},
          {max:115,v:"--c6",t:"108–115"},{max:1e9,v:"--c7",t:"≥ 115"}];
function binOf(i){for(var k=0;k<7;k++){if(i<BINS[k].max)return k}return 6}
function cvar(v){return "var("+v+")"}

var C=DATA.cities, byName={}, byDep={}, sel=null, hov=null;
C.forEach(function(c){byName[c.n]=c;byDep[c.cod.slice(0,2)]=c});
var pmax=Math.max.apply(null,C.map(function(c){return c.p}));
var maxDev=Math.max.apply(null,C.map(function(c){return Math.abs(c.i-100)}));

/* ============ escala ============ */
(function(){
  var b=$("#bins"),l=$("#binLabels");
  BINS.forEach(function(x){
    var d=document.createElement("div");d.className="bin";d.style.background=cvar(x.v);b.appendChild(d);
    var s=document.createElement("div");s.textContent=x.t;l.appendChild(s);
  });
})();

/* ============ mapa ============ */
var gDep=$("#gDep"),gTint=$("#gTint"),gTerr=$("#gTerr"),gMk=$("#gMk"),gLbl=$("#gLbl"),gz=$("#gz");
DATA.deps.forEach(function(d){
  var p=document.createElementNS(SVGNS,"path");
  p.setAttribute("d",d.d);p.setAttribute("class","dep");gDep.appendChild(p);
});
DATA.deps.forEach(function(d){
  var c=byDep[d.c]; if(!c) return;
  var p=document.createElementNS(SVGNS,"path");
  p.setAttribute("d",d.d);p.setAttribute("class","deptint");
  p.setAttribute("fill",cvar(BINS[binOf(c.i)].v));
  bind(p,c);gTint.appendChild(p);c._tint=p;
});
C.forEach(function(c){
  var p=document.createElementNS(SVGNS,"path");
  p.setAttribute("d",c.d);p.setAttribute("class","terr");
  p.setAttribute("fill",cvar(BINS[binOf(c.i)].v));
  p.setAttribute("tabindex","0");p.setAttribute("role","button");
  bind(p,c);gTerr.appendChild(p);c._path=p;
});
C.forEach(function(c){
  var r=3+23*Math.sqrt(c.p/pmax);
  var g=document.createElementNS(SVGNS,"g");
  var k=document.createElementNS(SVGNS,"circle");
  k.setAttribute("cx",c.x);k.setAttribute("cy",c.y);k.setAttribute("r",r.toFixed(1));
  k.setAttribute("class","mk");k.setAttribute("fill",cvar(BINS[binOf(c.i)].v));
  var d=document.createElementNS(SVGNS,"circle");
  d.setAttribute("cx",c.x);d.setAttribute("cy",c.y);d.setAttribute("r","1.9");d.setAttribute("class","dot");
  g.appendChild(k);g.appendChild(d);bind(k,c);gMk.appendChild(g);c._mk=k;c._r=r;
});
var FIXED=["Bogotá","Medellín","Cali","Barranquilla","Bucaramanga","Riohacha"];
function drawLabels(){
  gLbl.textContent="";
  FIXED.forEach(function(n){
    var c=byName[n];if(!c)return;
    var t=document.createElementNS(SVGNS,"text");
    t.setAttribute("class","lbl");t.setAttribute("y",c.y+5);
    t.textContent=amName(c)+"  "+nf1.format(c.i);
    if(c.x>DATA.w*0.6){t.setAttribute("x",c.x-c._r-8);t.setAttribute("text-anchor","end")}
    else{t.setAttribute("x",c.x+c._r+8)}
    gLbl.appendChild(t);
  });
}
function bind(el,c){
  el.addEventListener("mouseenter",function(e){hov=c;showTip(e,c);paint()});
  el.addEventListener("mousemove",moveTip);
  el.addEventListener("mouseleave",function(){hov=null;hideTip();paint()});
  el.addEventListener("click",function(){choose(c)});
  el.addEventListener("keydown",function(e){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();choose(c)}});
  el.addEventListener("focus",function(){hov=c;paint()});
  el.addEventListener("blur",function(){hov=null;paint()});
}
function choose(c){select(c.n);zoomTo(c);
  gtag('event','select_city',{city:c.n,index:c.i});}

/* ============ zoom ============ */
var view={x:0,y:0,k:1};
function applyView(){
  gz.style.transition="transform .45s cubic-bezier(.4,0,.2,1)";
  gz.style.transformOrigin="0 0";
  gz.style.transform="translate("+view.x+"px,"+view.y+"px) scale("+view.k+")";
  gLbl.style.display=view.k>2.6?"none":"";
}
function zoomTo(c){var k=4.2;view.k=k;view.x=DATA.w/2-c.x*k;view.y=DATA.h/2-c.y*k;applyView()}
function zoomBy(f){var cx=DATA.w/2,cy=DATA.h/2,nk=Math.max(1,Math.min(14,view.k*f));
  view.x=cx-(cx-view.x)*(nk/view.k);view.y=cy-(cy-view.y)*(nk/view.k);view.k=nk;applyView()}
$("#zIn").onclick=function(){zoomBy(1.6)};
$("#zOut").onclick=function(){zoomBy(1/1.6)};
$("#zRst").onclick=function(){view={x:0,y:0,k:1};applyView()};

/* ============ tooltip ============ */
var tipEl=$("#tip");
function showTip(e,c){
  var s=DATA.serie[c.n];
  tipEl.innerHTML='<div class="tip-n">'+amName(c)+'</div>'+
    '<div class="tip-r"><span>'+T("tipIndex")+'</span><b>'+nf1.format(c.i)+'</b></div>'+
    '<div class="tip-r"><span>'+T("tipCanasta")+'</span><b>'+pesos(c.v)+'</b></div>'+
    '<div class="tip-r"><span>'+T("tipPop")+'</span><b>'+nf0.format(c.p)+'</b></div>'+
    '<div class="tip-r"><span>'+T("tipCpi")+'</span><b>'+
      (s?nf2.format(s.va[s.va.length-1])+' %':T("tipNoSerie"))+'</b></div>';
  tipEl.classList.add("show");moveTip(e);
}
function moveTip(e){
  var r=tipEl.getBoundingClientRect(),x=e.clientX+14,y=e.clientY+14;
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;
  if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;
  tipEl.style.left=Math.max(8,x)+"px";tipEl.style.top=Math.max(8,y)+"px";
}
function hideTip(){tipEl.classList.remove("show")}

/* ============ lista ============ */
function drawRows(){
  var box=$("#rows");box.textContent="";
  C.forEach(function(c){
    var r=document.createElement("div");
    r.className="row";r.tabIndex=0;r.setAttribute("role","button");
    var dev=c.i-100,w=Math.abs(dev)/maxDev*50;
    r.innerHTML='<div class="row-name">'+c.n+(c.am?' <span>'+(LANG==="es"?"A.M.":"metro")+'</span>':'')+
      '</div><div class="track"><span class="bar" style="'+
      (dev<0?('right:50%;width:'+w+'%'):('left:50%;width:'+w+'%'))+
      ';background:'+cvar(BINS[binOf(c.i)].v)+'"></span></div>'+
      '<div class="row-val">'+nf1.format(c.i)+'</div>';
    r.addEventListener("mouseenter",function(){hov=c;paint()});
    r.addEventListener("mouseleave",function(){hov=null;paint()});
    r.addEventListener("focus",function(){hov=c;paint()});
    r.addEventListener("blur",function(){hov=null;paint()});
    r.addEventListener("click",function(){choose(c)});
    r.addEventListener("keydown",function(e){
      if(e.key==="Enter"||e.key===" "){e.preventDefault();choose(c)}});
    box.appendChild(r);c._row=r;
  });
}

/* ============ detalle ============ */
function sparkline(c){
  var s=DATA.serie[c.n];
  if(!s)return '<div class="empty">'+T("noSerie")+'</div>';
  var v=s.i,n=v.length,mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),rg=(mx-mn)||1,pts=[];
  for(var j=0;j<n;j++)pts.push([(j/(n-1))*100,100-((v[j]-mn)/rg)*100]);
  var d=pts.map(function(p,j){return (j?"L":"M")+p[0].toFixed(2)+","+p[1].toFixed(2)}).join("");
  var area="M0,100L"+pts.map(function(p){return p[0].toFixed(2)+","+p[1].toFixed(2)}).join("L")+"L100,100Z";
  var last=pts[n-1];
  return '<div class="sparkwrap"><div class="spark-head"><span class="spark-t">'+T("sparkT")+
    '</span><span class="spark-v">'+mesLabel(s.m[0])+' → '+mesLabel(s.m[n-1])+'</span></div>'+
    '<svg class="spark" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+area+'" fill="var(--soft-lilac)"></path>'+
    '<path d="'+d+'" fill="none" stroke="var(--purple)" stroke-width="2" vector-effect="non-scaling-stroke" '+
    'stroke-linejoin="round" stroke-linecap="round"></path>'+
    '<circle cx="'+last[0].toFixed(2)+'" cy="'+last[1].toFixed(2)+'" r="3" fill="var(--purple)" '+
    'stroke="var(--white)" stroke-width="2" vector-effect="non-scaling-stroke"></circle></svg>'+
    '<div class="spark-head" style="margin-top:7px"><span class="spark-v">'+T("lastMonth")+
    ' <b>'+nf2.format(s.vm[n-1])+' %</b></span><span class="spark-v">'+T("last12")+
    ' <b>'+nf2.format(s.va[n-1])+' %</b></span></div></div>';
}
function drawDetail(){
  if(!sel)return;
  var c=byName[sel],dev=c.i-100,extra=c.p-c.pn;
  $("#detail").innerHTML=
    '<div class="d-top"><div><div class="d-name">'+amName(c)+'</div>'+
    '<div class="d-dep">'+c.dep+' · DIVIPOLA '+c.cod+'</div></div>'+
    '<div><div class="d-idx" style="color:'+cvar(BINS[binOf(c.i)].v)+'">'+nf1.format(c.i)+'</div>'+
    '<div class="d-cap">'+(dev>=0?"+":"−")+nf1.format(Math.abs(dev))+' '+T("vsAvg")+'</div></div></div>'+
    '<div class="facts">'+
    '<div><div class="fact-k">'+T("fCanasta")+'</div><div class="fact-v">'+pesos(c.v)+
      ' <small>'+T("perMonth")+'</small></div></div>'+
    '<div><div class="fact-k">'+T("fPop")+'</div><div class="fact-v">'+nf0.format(c.p)+
      (extra>0?' <small>+'+nf0.format(extra)+' '+T("fromAM")+'</small>':'')+'</div></div>'+
    '<div><div class="fact-k">'+T("fMun")+'</div><div class="fact-v">'+(1+c.ams.length)+'</div></div></div>'+
    '<div class="insight">'+(c.am?fill(T("amLine"),{list:c.ams.join(", ")}):T("soloLine"))+'</div>'+
    sparkline(c);
}
function select(n){sel=n;paint();drawDetail()}

/* ============ pintado ============ */
function paint(){
  var act=hov?hov.n:sel;
  C.forEach(function(c){
    var on=(c.n===act),dim=!!act&&!on;
    c._mk.classList.toggle("on",on);c._path.classList.toggle("on",on);
    if(c._tint)c._tint.classList.toggle("on",on);
    c._mk.classList.toggle("dim",dim);c._path.classList.toggle("dim",dim);
    if(c._tint)c._tint.classList.toggle("dim",dim);
    if(c._row)c._row.classList.toggle("on",c.n===sel);
  });
}

/* ============ kpis, notas, tabla, fuentes ============ */
function drawKpis(){
  var covN=DATA.pob/DATA.pobNacional*100,covU=DATA.pob/DATA.pobUrbana*100,
      hi=C[0],lo=C[C.length-1];
  var k=[[T("kpi1k"),nf1.format(DATA.pond),fill(T("kpi1d"),{x:nf1.format(DATA.pond-100)})],
         [T("kpi2k"),nf0.format((hi.i/lo.i-1)*100)+" %",
          fill(T("kpi2d"),{hi:amName(hi),lo:amName(lo)})],
         [T("kpi3k"),nf0.format(DATA.pob),
          fill(T("kpi3d"),{u:nf1.format(covU),n:nf1.format(covN)})],
         [T("kpi4k"),pesos(DATA.base),T("kpi4d")]];
  $("#kpis").innerHTML=k.map(function(x){
    return '<div class="kpi"><div class="kpi-k">'+x[0]+'</div><div class="kpi-v">'+x[1]+
      '</div><div class="kpi-d">'+x[2]+'</div></div>'}).join("");
}
function drawNotes(){
  $("#notes").innerHTML=
   '<div class="note hot"><h3>'+T("n1t")+'</h3><p>'+T("n1a")+'</p><p>'+T("n1b")+'</p></div>'+
   '<div class="note"><h3>'+T("n2t")+'</h3><p>'+T("n2a")+'</p><p>'+T("n2b")+'</p><p>'+T("n2c")+'</p></div>'+
   '<div class="note"><h3>'+T("n3t")+'</h3><p>'+T("n3a")+'</p><p>'+T("n3b")+'</p></div>'+
   '<div class="note"><h3>'+T("n4t")+'</h3><p>'+T("n4a")+'</p><p>'+T("n4b")+'</p><p>'+T("n4c")+'</p></div>';
}
function drawTable(){
  $("#tbody").innerHTML=C.map(function(c){
    var s=DATA.serie[c.n];
    return '<tr><td><span class="sw" style="background:'+cvar(BINS[binOf(c.i)].v)+'"></span>'+
      amName(c)+'</td><td>'+nf1.format(c.i)+'</td><td>'+pesos(c.v)+'</td><td>'+nf0.format(c.p)+
      '</td><td>'+(s?nf2.format(s.va[s.va.length-1])+' %':'—')+'</td><td>'+(1+c.ams.length)+
      '</td></tr>'}).join("");
}
function drawSrc(){$("#src").innerHTML=fill(T("srcHtml"),DATA.src)}

/* ============ vista mapa/tabla ============ */
(function(){
  var bm=$("#bMapa"),bt=$("#bTabla");
  function show(mapa){
    $("#mapbox").hidden=!mapa;$("#tabwrap").hidden=mapa;
    bm.setAttribute("aria-pressed",String(mapa));bt.setAttribute("aria-pressed",String(!mapa));
    gtag('event','change_view',{view:mapa?'map':'table'});
  }
  bm.onclick=function(){show(true)};bt.onclick=function(){show(false)};
})();

/* ============ i18n + tema ============ */
function renderAll(){drawLabels();drawRows();drawDetail();drawKpis();drawNotes();drawTable();drawSrc();paint()}
function applyI18n(lang){
  LANG=lang;setLocale();
  var d=I18N[lang]||I18N.es;
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var k=el.getAttribute("data-i18n");if(d[k]!=null)el.textContent=d[k]});
  document.querySelectorAll("[data-i18n-html]").forEach(function(el){
    var k=el.getAttribute("data-i18n-html");if(d[k]!=null)el.innerHTML=d[k]});
  document.querySelectorAll("[data-i18n-attr]").forEach(function(el){
    el.getAttribute("data-i18n-attr").split(";").forEach(function(pair){
      var s=pair.split(":"),k=s[1];if(d[k]!=null)el.setAttribute(s[0].trim(),d[k])})});
  var lt=document.getElementById("langToggle");
  if(lt){lt.textContent=lang.toUpperCase();
    lt.setAttribute("aria-label",lang==="es"?"Switch language to English":"Cambiar idioma a español")}
  renderAll();
}
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme",theme);
  var tt=document.getElementById("themeToggle");
  if(tt){tt.textContent=theme==="dark"?"☀️":"🌙";tt.setAttribute("aria-pressed",String(theme==="dark"))}
}
(function init(){
  var stamped=document.documentElement.getAttribute("data-theme");
  var sysDark=window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches;
  var theme=safeStore.get("jf-theme")||stamped||(sysDark?"dark":"light");
  var lang=safeStore.get("jf-lang")||safeStore.get("iac_lang")||"es";
  if(lang!=="es"&&lang!=="en")lang="es";
  applyTheme(theme);
  sel="Bogotá";              // se fija antes de formatear; applyI18n dispara el render
  applyI18n(lang);
  applyView();
  document.getElementById("themeToggle").addEventListener("click",function(){
    theme=theme==="dark"?"light":"dark";safeStore.set("jf-theme",theme);applyTheme(theme);
    gtag('event','toggle_theme',{theme:theme})});
  document.getElementById("langToggle").addEventListener("click",function(){
    lang=lang==="es"?"en":"es";safeStore.set("jf-lang",lang);safeStore.set("iac_lang",lang);
    applyI18n(lang);gtag('event','toggle_lang',{lang:lang})});
})();
})();
</script>
